<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모둠 점수판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #F3F4F6;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* 입력창 스타일 리셋 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* 카드 등장 애니메이션 */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .card-animate {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* 점수 변경 애니메이션 */
        @keyframes scoreBump {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .score-bump {
            animation: scoreBump 0.2s ease-out;
        }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden text-gray-800">

    <!-- Header -->
    <header class="flex justify-between items-center px-8 py-4 bg-white/80 backdrop-blur-md shadow-sm z-10 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-3xl font-black tracking-tight text-gray-900">모둠 점수판</h1>
            <span class="text-sm font-medium px-3 py-1 bg-gray-100 text-gray-500 rounded-full" id="teamCountBadge">6개 모둠</span>
        </div>
        <div class="flex gap-3">
            <button onclick="openResetAllModal()" class="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition-colors shadow-sm">
                <i class="ph ph-arrow-counter-clockwise text-lg"></i>
                전체 초기화
            </button>
            <button onclick="addTeam()" class="flex items-center gap-2 px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-sm shadow-blue-200">
                <i class="ph ph-plus-circle text-lg"></i>
                모둠 추가
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-auto p-6 lg:p-8 flex flex-col">
        <div id="teamsContainer" class="grid gap-6 items-stretch flex-1 w-full place-content-center transition-all duration-300">
            <!-- 모둠 카드가 JavaScript를 통해 이곳에 렌더링됩니다. -->
        </div>
    </main>

    <!-- 점수 뺏기 모달 -->
    <div id="stealModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="stealModalContent">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
                    <i class="ph-fill ph-mask-happy text-purple-500"></i> 점수 뺏어오기
                </h2>
                <button onclick="closeStealModal()" class="text-gray-400 hover:text-gray-700 transition-colors">
                    <i class="ph ph-x text-2xl"></i>
                </button>
            </div>
            
            <p class="text-gray-600 mb-4 text-sm font-medium">어느 모둠의 점수를 뺏어올까요?</p>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">대상 모둠</label>
                    <select id="stealTarget" class="w-full bg-gray-50 border border-gray-200 text-gray-900 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent font-semibold cursor-pointer appearance-none">
                        <!-- 옵션이 동적으로 추가됩니다 -->
                    </select>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">뺏을 점수</label>
                    <div class="flex items-center gap-3">
                        <button onclick="adjustStealAmount(-1)" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                            <i class="ph ph-minus font-bold"></i>
                        </button>
                        <input type="number" id="stealAmount" value="1" min="1" class="flex-1 bg-gray-50 border border-gray-200 text-center text-xl font-bold rounded-xl py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <button onclick="adjustStealAmount(1)" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200 transition-colors">
                            <i class="ph ph-plus font-bold"></i>
                        </button>
                    </div>
                </div>
                
                <button onclick="executeSteal()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold text-lg py-4 rounded-xl mt-4 transition-colors shadow-lg shadow-purple-200">
                    점수 가져오기!
                </button>
            </div>
        </div>
    </div>

    <!-- 범용 확인 모달 -->
    <div id="confirmModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl transform scale-95 transition-transform duration-200" id="confirmModalContent">
            <h3 id="confirmTitle" class="text-xl font-bold text-gray-900 mb-2">확인</h3>
            <p id="confirmMessage" class="text-gray-600 mb-6 font-medium">정말 실행하시겠습니까?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 px-4 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">
                    취소
                </button>
                <button id="confirmBtn" class="flex-1 px-4 py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl transition-colors shadow-sm">
                    확인
                </button>
            </div>
        </div>
    </div>

    <script>
        // 테마 팔레트 정의 (배경색, 텍스트색, 보더, 버튼 스타일 등)
        const themes = {
            white: { bg: '#ffffff', text: '#111827', border: '#e5e7eb', btnBg: '#f3f4f6', btnHover: '#e5e7eb', icon: '#4b5563', name: '화이트' },
            blue: { bg: '#3b82f6', text: '#ffffff', border: '#3b82f6', btnBg: 'rgba(255,255,255,0.2)', btnHover: 'rgba(255,255,255,0.3)', icon: '#ffffff', name: '블루' },
            black: { bg: '#1f2937', text: '#ffffff', border: '#1f2937', btnBg: 'rgba(255,255,255,0.1)', btnHover: 'rgba(255,255,255,0.2)', icon: '#ffffff', name: '블랙' },
            pink: { bg: '#ec4899', text: '#ffffff', border: '#ec4899', btnBg: 'rgba(255,255,255,0.2)', btnHover: 'rgba(255,255,255,0.3)', icon: '#ffffff', name: '핑크' },
            green: { bg: '#10b981', text: '#ffffff', border: '#10b981', btnBg: 'rgba(255,255,255,0.2)', btnHover: 'rgba(255,255,255,0.3)', icon: '#ffffff', name: '그린' },
            yellow: { bg: '#f59e0b', text: '#111827', border: '#f59e0b', btnBg: 'rgba(0,0,0,0.1)', btnHover: 'rgba(0,0,0,0.15)', icon: '#111827', name: '옐로우' },
            purple: { bg: '#8b5cf6', text: '#ffffff', border: '#8b5cf6', btnBg: 'rgba(255,255,255,0.2)', btnHover: 'rgba(255,255,255,0.3)', icon: '#ffffff', name: '퍼플' },
            red: { bg: '#ef4444', text: '#ffffff', border: '#ef4444', btnBg: 'rgba(255,255,255,0.2)', btnHover: 'rgba(255,255,255,0.3)', icon: '#ffffff', name: '레드' }
        };

        const themeKeys = Object.keys(themes);

        // 초기 상태 (1~6 모둠)
        let teams = [
            { id: 1, name: '1모둠', score: 0, theme: 'white' },
            { id: 2, name: '2모둠', score: 0, theme: 'blue' },
            { id: 3, name: '3모둠', score: 0, theme: 'black' },
            { id: 4, name: '4모둠', score: 0, theme: 'pink' },
            { id: 5, name: '5모둠', score: 0, theme: 'green' },
            { id: 6, name: '6모둠', score: 0, theme: 'yellow' }
        ];
        
        let nextTeamId = 7;
        let currentStealingTeamId = null;

        // 화면 렌더링 함수
        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            document.getElementById('teamCountBadge').innerText = `${teams.length}개 모둠`;
            
            // 모둠 개수에 따른 동적 그리드 클래스 및 반응형 크기 자동 조절
            const len = teams.length;
            let gridClass = 'grid gap-6 items-stretch flex-1 w-full place-content-center transition-all duration-300 ';
            
            if (len === 1) gridClass += 'grid-cols-1 max-w-lg mx-auto';
            else if (len === 2) gridClass += 'grid-cols-1 sm:grid-cols-2 max-w-5xl mx-auto';
            else if (len === 3) gridClass += 'grid-cols-1 sm:grid-cols-3 max-w-7xl mx-auto';
            else if (len === 4) gridClass += 'grid-cols-1 sm:grid-cols-2 xl:grid-cols-4';
            else if (len === 5) gridClass += 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5';
            else if (len === 6) gridClass += 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6';
            else if (len >= 7 && len <= 8) gridClass += 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-4';
            else gridClass += 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5';
            
            container.className = gridClass;

            let html = '';
            teams.forEach((team) => {
                const theme = themes[team.theme];
                // 팔레트 HTML 생성
                let paletteHtml = themeKeys.map(key => {
                    const t = themes[key];
                    const isSelected = key === team.theme;
                    const ringClass = isSelected ? (key==='white' ? 'ring-2 ring-gray-400 ring-offset-2' : 'ring-2 ring-white ring-offset-2 ring-offset-current') : '';
                    return `<button onclick="changeTeamTheme(${team.id}, '${key}')" 
                                    class="w-4 h-4 rounded-full transition-transform hover:scale-125 ${ringClass}" 
                                    style="background-color: ${t.bg}; ${key==='white'? 'border: 1px solid #d1d5db;': ''}" 
                                    title="${t.name}"></button>`;
                }).join('');

                html += `
                    <div id="team-card-${team.id}" class="card-animate rounded-3xl flex flex-col justify-between shadow-lg relative overflow-hidden transition-all duration-300 h-full min-h-[400px]"
                         style="background-color: ${theme.bg}; color: ${theme.text}; border: ${team.theme === 'white' ? '2px solid #e5e7eb' : '2px solid '+theme.bg};">
                        
                        <!-- Top Bar (Palette & Delete) -->
                        <div class="flex justify-between items-center p-4">
                            <div class="flex gap-1.5 items-center bg-black/5 rounded-full px-2 py-1 backdrop-blur-sm" style="${team.theme==='white'?'background: #f3f4f6':''}">
                                ${paletteHtml}
                            </div>
                            <button onclick="promptDeleteTeam(${team.id})" class="w-8 h-8 flex items-center justify-center rounded-full transition-colors hover:bg-black/10" style="color: ${theme.icon}">
                                <i class="ph ph-x text-lg font-bold"></i>
                            </button>
                        </div>

                        <!-- Center (Name, Score, Controls) -->
                        <div class="flex-1 flex flex-col items-center justify-center px-4">
                            <input type="text" value="${team.name}" onchange="updateTeamName(${team.id}, this.value)" 
                                   class="text-2xl font-black text-center bg-transparent border-none outline-none w-full mb-4 px-2 py-1 rounded-lg transition-colors focus:ring-2"
                                   style="color: ${theme.text}; focus:ring-color: ${theme.icon}; background-color: transparent;"
                                   onfocus="this.style.backgroundColor='${theme.btnBg}'" 
                                   onblur="this.style.backgroundColor='transparent'">
                            
                            <div class="text-[6rem] font-black leading-none mb-6 relative" id="score-text-${team.id}">
                                ${team.score}
                            </div>
                            
                            <!-- +/- Buttons -->
                            <div class="flex gap-4">
                                <button onclick="updateScore(${team.id}, -1)" class="w-12 h-12 rounded-full flex items-center justify-center transition-all hover:scale-110 active:scale-95"
                                        style="background-color: ${theme.btnBg}; color: ${theme.icon}">
                                    <i class="ph ph-minus text-2xl font-bold"></i>
                                </button>
                                <button onclick="updateScore(${team.id}, 1)" class="w-12 h-12 rounded-full flex items-center justify-center transition-all hover:scale-110 active:scale-95"
                                        style="background-color: ${theme.btnBg}; color: ${theme.icon}">
                                    <i class="ph ph-plus text-2xl font-bold"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Bottom Actions -->
                        <div class="p-4 flex gap-2">
                            <button onclick="promptResetScore(${team.id})" class="flex-1 py-3 rounded-xl font-bold text-sm transition-all hover:brightness-95 active:scale-95 flex items-center justify-center gap-1"
                                    style="background-color: ${theme.btnBg}; color: ${theme.text};">
                                <i class="ph ph-arrow-u-up-left"></i> 리셋
                            </button>
                            <button onclick="openStealModal(${team.id})" class="flex-1 py-3 rounded-xl font-bold text-sm transition-all active:scale-95 flex items-center justify-center gap-1 shadow-sm"
                                    style="background-color: ${theme.text === '#ffffff' ? 'rgba(0,0,0,0.3)' : '#111827'}; color: #ffffff;">
                                <i class="ph-fill ph-mask-happy"></i> 점수뺏기
                            </button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 점수 증감 및 애니메이션
        function updateScore(id, delta) {
            const team = teams.find(t => t.id === id);
            if(team) {
                team.score += delta;
                
                // 👇 이 아랫줄을 추가해 주세요!
        saveToGoogleSheet(team.name, team.score);
                // 전체 리렌더링 대신 해당 점수 부분만 DOM 업데이트하여 애니메이션 적용
                const scoreElement = document.getElementById(`score-text-${id}`);
                if (scoreElement) {
                    scoreElement.innerText = team.score;
                    // 애니메이션 재시작
                    scoreElement.classList.remove('score-bump');
                    void scoreElement.offsetWidth; // trigger reflow
                    scoreElement.classList.add('score-bump');
                }
            }
        }

        // 테마 변경
        function changeTeamTheme(id, themeKey) {
            const team = teams.find(t => t.id === id);
            if(team && themes[themeKey]) {
                team.theme = themeKey;
                renderTeams();
            }
        }

        // 이름 업데이트
        function updateTeamName(id, newName) {
            const team = teams.find(t => t.id === id);
            if(team) {
                team.name = newName;
            }
        }

        // 모둠 추가
        function addTeam() {
            // 랜덤 테마 선택
            const randomTheme = themeKeys[teams.length % themeKeys.length];
            const newTeam = {
                id: nextTeamId++,
                name: `${teams.length + 1}모둠`,
                score: 0,
                theme: randomTheme
            };
            teams.push(newTeam);
            renderTeams();
            
            // 새 카드 스크롤 포커스
            setTimeout(() => {
                const container = document.getElementById('teamsContainer');
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        // 개별 점수 리셋 (확인)
        function promptResetScore(id) {
            const team = teams.find(t => t.id === id);
            if(!team) return;
            
            showConfirmModal('점수 초기화', `'${team.name}'의 점수를 0점으로 초기화하시겠습니까?`, '초기화', 'bg-yellow-500 hover:bg-yellow-600', () => {
                team.score = 0;
                renderTeams();
            });
        }

        // 전체 점수 리셋 (확인)
        function openResetAllModal() {
            showConfirmModal('전체 초기화', '모든 모둠의 점수를 0점으로 초기화하시겠습니까?', '전체 초기화', 'bg-red-500 hover:bg-red-600', () => {
                teams.forEach(t => t.score = 0);
                renderTeams();
            });
        }

        // 모둠 삭제 (확인)
        function promptDeleteTeam(id) {
            const team = teams.find(t => t.id === id);
            if(!team) return;

            showConfirmModal('모둠 삭제', `'${team.name}'을(를) 삭제하시겠습니까?<br><span class="text-xs text-red-500">* 복구할 수 없습니다.</span>`, '삭제', 'bg-red-600 hover:bg-red-700', () => {
                const card = document.getElementById(`team-card-${id}`);
                // 사라지는 애니메이션 (선택적)
                if(card) {
                    card.style.transform = 'scale(0.8)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        teams = teams.filter(t => t.id !== id);
                        renderTeams();
                    }, 300);
                } else {
                    teams = teams.filter(t => t.id !== id);
                    renderTeams();
                }
            });
        }

        // 점수 뺏기 모달 관련 로직
        const stealModal = document.getElementById('stealModal');
        const stealModalContent = document.getElementById('stealModalContent');
        const stealTargetSelect = document.getElementById('stealTarget');
        const stealAmountInput = document.getElementById('stealAmount');

        function openStealModal(stealerId) {
            const stealerTeam = teams.find(t => t.id === stealerId);
            const otherTeams = teams.filter(t => t.id !== stealerId);
            
            if (otherTeams.length === 0) {
                showConfirmModal('알림', '점수를 뺏을 다른 모둠이 없습니다.', '확인', 'bg-gray-800 hover:bg-gray-900', () => {});
                document.getElementById('confirmBtn').previousElementSibling.style.display = 'none'; // 취소 버튼 숨기기
                return;
            }

            currentStealingTeamId = stealerId;
            
            // 옵션 채우기
            stealTargetSelect.innerHTML = otherTeams.map(t => 
                `<option value="${t.id}">${t.name} (현재 ${t.score}점)</option>`
            ).join('');
            
            stealAmountInput.value = 1; // 기본값 리셋

            // 모달 열기 애니메이션
            stealModal.classList.remove('hidden');
            stealModal.classList.add('flex');
            setTimeout(() => {
                stealModal.classList.remove('opacity-0');
                stealModalContent.classList.remove('scale-95');
                stealModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeStealModal() {
            stealModal.classList.add('opacity-0');
            stealModalContent.classList.remove('scale-100');
            stealModalContent.classList.add('scale-95');
            setTimeout(() => {
                stealModal.classList.add('hidden');
                stealModal.classList.remove('flex');
                currentStealingTeamId = null;
            }, 300);
        }

        function adjustStealAmount(delta) {
            let val = parseInt(stealAmountInput.value) || 0;
            val += delta;
            if(val < 1) val = 1;
            stealAmountInput.value = val;
        }

        function executeSteal() {
            const targetId = parseInt(stealTargetSelect.value);
            const amount = parseInt(stealAmountInput.value);
            
            if (!targetId || isNaN(amount) || amount <= 0 || !currentStealingTeamId) {
                closeStealModal();
                return;
            }

            const stealer = teams.find(t => t.id === currentStealingTeamId);
            const target = teams.find(t => t.id === targetId);

            if (stealer && target) {
                // 점수 적용
                target.score -= amount;
                stealer.score += amount;
                
                closeStealModal();
                
                // 즉시 렌더링 후 점수가 변경된 두 요소에 애니메이션 주기
                renderTeams();
                
                setTimeout(() => {
                    const stealerEl = document.getElementById(`score-text-${stealer.id}`);
                    const targetEl = document.getElementById(`score-text-${target.id}`);
                    if(stealerEl) stealerEl.classList.add('score-bump');
                    if(targetEl) {
                        targetEl.classList.add('score-bump');
                        targetEl.style.color = '#ef4444'; // 잠깐 빨간색
                        setTimeout(() => targetEl.style.color = '', 300);
                    }
                }, 50);
            }
        }

        // 공통 Confirm 모달 관련 로직 (alert/confirm 대체)
        const confirmModal = document.getElementById('confirmModal');
        const confirmModalContent = document.getElementById('confirmModalContent');
        let confirmActionCallback = null;

        function showConfirmModal(title, message, btnText, btnClass, callback) {
            document.getElementById('confirmTitle').innerHTML = title;
            document.getElementById('confirmMessage').innerHTML = message;
            
            const btn = document.getElementById('confirmBtn');
            btn.innerHTML = btnText;
            btn.className = `flex-1 px-4 py-3 text-white font-bold rounded-xl transition-colors shadow-sm ${btnClass}`;
            
            // 취소 버튼 다시 보이게 설정 (점수 뺏기 에러 팝업에서 숨겼을 수 있으므로)
            btn.previousElementSibling.style.display = 'block';

            confirmActionCallback = callback;

            confirmModal.classList.remove('hidden');
            confirmModal.classList.add('flex');
            setTimeout(() => {
                confirmModal.classList.remove('opacity-0');
                confirmModalContent.classList.remove('scale-95');
                confirmModalContent.classList.add('scale-100');
            }, 10);
        }

        function closeConfirmModal() {
            confirmModal.classList.add('opacity-0');
            confirmModalContent.classList.remove('scale-100');
            confirmModalContent.classList.add('scale-95');
            setTimeout(() => {
                confirmModal.classList.add('hidden');
                confirmModal.classList.remove('flex');
                confirmActionCallback = null;
            }, 200);
        }

        document.getElementById('confirmBtn').addEventListener('click', () => {
            if(confirmActionCallback) confirmActionCallback();
            closeConfirmModal();
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') {
                if(!stealModal.classList.contains('hidden')) closeStealModal();
                if(!confirmModal.classList.contains('hidden')) closeConfirmModal();
            }
        });

        // 초기 렌더링
        window.onload = () => {
            renderTeams();
        };
        function saveToGoogleSheet(teamName, score) {
  const webAppUrl = 'https://script.google.com/macros/s/AKfycbwLjO4iK9dG5RCTFHy0xNNyXdGd1diSxibNEVWvl1uuTfyoAJoVL4Jl8haQT1ch5u7a/exec'; // 1단계에서 복사한 URL로 교체
  fetch(webAppUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ team: teamName, score: score })
  });
}
    </script>
